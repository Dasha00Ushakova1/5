<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое приглашение на День программиста</title>
    <style>
        /* Ваши стили здесь */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #F0FFF0; /* Светлый фон */
            color: #333333; /* Темный цвет текста для контраста */
            background-image: url('background.jpg'); /* Добавьте ваше изображение фона */
            background-size: cover;
            background-attachment: fixed;
        }
        header {
            background-color: #9932CC; /* Основной цвет заголовка */
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        main {
            max-width: 800px; /* Максимальная ширина основного контента */
            margin: 20px auto; /* Центрирование основного контента */
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9); /* Полупрозрачный фон */
            border-radius: 10px;
            backdrop-filter: blur(10px); /* Размытие фона */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Тень для основного контента */
            text-align: center; /* Центрирование текста */
        }
        .register-button {
            background-color: #9932CC; /* Цвет кнопки */
            color: white;
            padding: 10px 20px; /* Увеличенные размеры кнопки */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            margin-top: 15px;
            display: inline-block;
            text-decoration: none; /* Убираем подчеркивание */
        }
        .register-button:hover {
            background-color: #DA70D6; /* Цвет кнопки при наведении */
            transform: scale(1.05); /* Увеличение при наведении */
        }
    </style>
</head>
<body>
    <header>
        <h1>Цифровое приглашение на День программиста</h1>
    </header>
    <main>
        <h2>День программиста</h2>
        <p>Дата: 13 сентября 2025 года</p> <!-- Укажите дату -->
        <p>Время: 10:00 - 16:00</p> <!-- Укажите время -->
        <p>Место: <a href="https://example.com" target="_blank">Ссылка на трансляцию</a></p> <!-- Укажите место или ссылку -->
        <p>Организаторы: Ушакова Д., Егорова О., Тимощенкова Д., Ахметзянова А. </p> <!-- Укажите название колледжа -->
        <a href="registration.html" class="register-button">Зарегистрироваться</a> <!-- Ссылка на страницу регистрации -->
    </main>
    <footer>
        <p>Следите за нами в социальных сетях!</p>
    </footer>
</body>
</html>
